name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装
        run: pip install -e ".[dev]"

      - name: 单元测试
        run: pytest -q

      - name: 离线自检（不连任何真实平台）
        run: python -m mpc selftest

      - name: 能力矩阵自检
        run: python -m mpc capabilities
