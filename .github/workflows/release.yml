name: Release (Windows exe)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装（含 GUI 依赖）
        run: pip install -e ".[gui,dev]"

      - name: 打包 exe
        run: python -m PyInstaller --noconfirm --clean packaging/mpc-hub.spec

      - name: 压成 zip（别人下载即用）
        run: Compress-Archive -Path dist/MPC-Hub.exe,dist/mpc.exe -DestinationPath dist/mpc-hub-windows-x64.zip -Force

      - name: 挂到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/mpc-hub-windows-x64.zip
          generate_release_notes: true

      - uses: actions/upload-artifact@v4
        with:
          name: mpc-hub-windows-x64
          path: dist/mpc-hub-windows-x64.zip
