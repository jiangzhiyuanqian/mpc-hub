[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mpc-hub"
version = "0.2.0"
description = "多平台连接中心 —— 独立的社交通道客服后台（自带 agent 运行时）"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "jiangzhiyuanqian" }]
keywords = ["customer-service", "agent", "wechat", "onebot", "llm", "chatbot"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Chat",
]
dependencies = [
  "langgraph>=1.2",
  "langgraph-checkpoint-sqlite",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "qrcode>=7.4",
  "pypng>=0.20220715.0",
]

[project.urls]
Homepage = "https://github.com/jiangzhiyuanqian/mpc-hub"
Repository = "https://github.com/jiangzhiyuanqian/mpc-hub"
Issues = "https://github.com/jiangzhiyuanqian/mpc-hub/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mpc = "mpc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
